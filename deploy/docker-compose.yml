# cv-service next to the Hostinger "n8n" VPS template (n8n already running in Docker).
# It joins n8n's own compose network, so n8n reaches it as http://cv-service:8000 and the
# link survives restarts of either container.
#
#   git clone https://github.com/Pio57/immobiliare-photo-lab.git /opt/photo-lab
#   cd /opt/photo-lab
#   N8N_NETWORK=$(docker inspect <n8n container> --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
#   N8N_NETWORK=$N8N_NETWORK docker compose -f deploy/docker-compose.yml up -d --build
#
# Then set CV_SERVICE_PUBLIC_URL=http://cv-service:8000 in .env before regenerating the workflows.
services:
  cv-service:
    build: ../cv-service
    container_name: cv-service
    restart: unless-stopped
    environment:
      - REPO_ROOT=/data
    volumes:
      - ../dataset:/data/dataset
      - ../experiments:/data/experiments
      - ../frontend/public/snapshot:/data/snapshot:ro
    expose: ["8000"]
    networks: [n8n]
networks:
  n8n:
    external: true
    name: ${N8N_NETWORK:-n8n-8zow_default}
