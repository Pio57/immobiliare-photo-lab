# cv-service next to a Hostinger "n8n" VPS template (n8n already running in Docker).
#
#   git clone https://github.com/Pio57/immobiliare-photo-lab.git /opt/photo-lab
#   cd /opt/photo-lab && cp .env.example .env && nano .env      # only REPLICATE/ANTHROPIC are needed by n8n, not here
#   docker network create photolab || true
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Then attach the n8n container to the same network so it can reach http://cv-service:8000:
#   docker network connect photolab <n8n container name>
# and set CV_SERVICE_PUBLIC_URL=http://cv-service:8000 in .env before regenerating the workflows.
services:
  cv-service:
    build: ../cv-service
    container_name: cv-service
    restart: unless-stopped
    environment:
      - REPO_ROOT=/data
    volumes:
      - ../dataset:/data/dataset
      - ../experiments:/data/experiments
    expose: ["8000"]
    networks: [photolab]
networks:
  photolab:
    external: true
